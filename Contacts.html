<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact | Bruce</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark portfolio-navbar">
      <div class="container">
        <a class="navbar-brand" href="index.html">BRUCE<span>.</span>WUTHRICH</a
        ><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Ouvrir le menu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="menu">
          <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Accueil</a><a class="nav-link" href="a-propos.html">À propos</a><a class="nav-link" href="competences.html">Compétences</a><a class="nav-link" href="Cours.html">Cours</a><a class="nav-link" href="Projects.html">Projets</a><a class="nav-link active" href="Contacts.html">Contact</a>
          </div>
        </div>
      </div>
    </nav>
    <main class="container page-space">
      <div class="page-title">
        <p class="eyebrow">Parlons de votre idée</p>
        <h1>Me contacter</h1>
        <p>
          Remplissez ce formulaire. La démonstration vérifie les champs mais
          n’envoie pas encore d’e-mail.
        </p>
      </div>
      <form id="contactForm" class="contact-form" novalidate>
        <label for="name">Nom</label
        ><input id="name" class="form-control" type="text" /><small
          id="nameError"
        ></small
        ><label for="email">E-mail</label
        ><input id="email" class="form-control" type="email" /><small
          id="emailError"
        ></small
        ><label for="message">Message</label
        ><textarea id="message" class="form-control" rows="6"></textarea
        ><small id="messageError"></small
        ><button class="btn btn-primary btn-lg" type="submit">
          Envoyer le message
        </button>
        <p id="formSuccess" class="success-message"></p>
      </form>
    </main>
    <footer>© <span class="current-year"></span> Bruce</footer>
    <!-- jQuery doit être chargé avant notre fichier JavaScript. -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
